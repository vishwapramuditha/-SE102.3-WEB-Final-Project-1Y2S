<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0f00"/>
      <stop offset="60%" stop-color="#2d1a00"/>
      <stop offset="100%" stop-color="#1a1000"/>
    </linearGradient>
    <linearGradient id="gbar7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="overlay7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a0f00" stop-opacity="0.97"/>
      <stop offset="55%" stop-color="#1a0f00" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#1a0f00" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg7)"/>
  <!-- Court lines -->
  <g stroke="#f59e0b" stroke-width="1" opacity="0.18">
    <rect x="480" y="60" width="280" height="360" rx="2"/>
    <line x1="480" y1="240" x2="760" y2="240"/>
    <line x1="620" y1="60" x2="620" y2="420"/>
    <line x1="480" y1="140" x2="760" y2="140"/>
    <line x1="480" y1="340" x2="760" y2="340"/>
  </g>
  <!-- Net -->
  <line x1="480" y1="240" x2="760" y2="240" stroke="#f59e0b" stroke-width="3" opacity="0.5"/>
  <g stroke="#f59e0b" stroke-width="0.7" opacity="0.3">
    <line x1="490" y1="240" x2="490" y2="220"/><line x1="510" y1="240" x2="510" y2="220"/>
    <line x1="530" y1="240" x2="530" y2="220"/><line x1="550" y1="240" x2="550" y2="220"/>
    <line x1="570" y1="240" x2="570" y2="220"/><line x1="590" y1="240" x2="590" y2="220"/>
    <line x1="610" y1="240" x2="610" y2="220"/><line x1="630" y1="240" x2="630" y2="220"/>
    <line x1="650" y1="240" x2="650" y2="220"/><line x1="670" y1="240" x2="670" y2="220"/>
    <line x1="690" y1="240" x2="690" y2="220"/><line x1="710" y1="240" x2="710" y2="220"/>
    <line x1="730" y1="240" x2="730" y2="220"/><line x1="750" y1="240" x2="750" y2="220"/>
  </g>
  <!-- Badminton racket -->
  <g transform="translate(520, 100) rotate(30)">
    <!-- Handle -->
    <rect x="55" y="200" width="16" height="100" rx="6" fill="#8b5e2a"/>
    <rect x="55" y="200" width="16" height="10" rx="3" fill="#d4a843"/>
    <!-- Grip -->
    <rect x="56" y="230" width="14" height="60" rx="4" fill="#5a3010" stroke="#8b5e2a" stroke-width="0.5"/>
    <!-- Throat -->
    <path d="M56 200 Q52 180 50 160 L76 160 Q74 180 70 200 Z" fill="#c0a060"/>
    <!-- Frame (oval) -->
    <ellipse cx="63" cy="100" rx="45" ry="62" fill="none" stroke="#d4a843" stroke-width="3"/>
    <!-- Strings -->
    <g stroke="#e8e0d0" stroke-width="0.6" opacity="0.7">
      <line x1="18" y1="60" x2="108" y2="60"/><line x1="18" y1="75" x2="108" y2="75"/>
      <line x1="18" y1="90" x2="108" y2="90"/><line x1="18" y1="105" x2="108" y2="105"/>
      <line x1="18" y1="120" x2="108" y2="120"/><line x1="18" y1="135" x2="108" y2="135"/>
      <line x1="32" y1="38" x2="32" y2="158"/><line x1="47" y1="38" x2="47" y2="158"/>
      <line x1="62" y1="38" x2="62" y2="158"/><line x1="77" y1="38" x2="77" y2="158"/>
      <line x1="92" y1="38" x2="92" y2="158"/>
    </g>
    <!-- Sweet spot highlight -->
    <ellipse cx="63" cy="95" rx="20" ry="25" fill="#f59e0b" fill-opacity="0.08"/>
  </g>
  <!-- Shuttlecock -->
  <g transform="translate(660, 160)">
    <circle cx="20" cy="70" r="12" fill="#fff" opacity="0.9"/>
    <!-- Feathers -->
    <g stroke="#e8e0d0" stroke-width="1.2" opacity="0.85">
      <line x1="20" y1="58" x2="14" y2="20"/><line x1="20" y1="58" x2="20" y2="15"/>
      <line x1="20" y1="58" x2="26" y2="20"/><line x1="20" y1="58" x2="10" y2="28"/>
      <line x1="20" y1="58" x2="30" y2="28"/>
    </g>
    <!-- Motion trail -->
    <g stroke="#f59e0b" stroke-width="1" opacity="0.3">
      <line x1="10" y1="80" x2="-20" y2="70"/><line x1="8" y1="85" x2="-25" y2="82"/>
      <line x1="12" y1="90" x2="-18" y2="95"/>
    </g>
  </g>
  <!-- Left overlay -->
  <rect width="800" height="450" fill="url(#overlay7)"/>
  <!-- Accent bar -->
  <rect x="0" y="0" width="5" height="450" fill="url(#gbar7)"/>
  <!-- Category badge -->
  <rect x="28" y="30" width="68" height="24" rx="4" fill="#f59e0b"/>
  <text x="62" y="47" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#1a0f00" text-anchor="middle" letter-spacing="0.5">SPORTS</text>
  <!-- Headline -->
  <text x="28" y="105" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#ffffff">NSBM Badminton Team</text>
  <text x="28" y="138" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#ffffff">Wins South Zone</text>
  <text x="28" y="171" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#f59e0b">Championship Title</text>
  <!-- Excerpt -->
  <text x="28" y="215" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.65)">NSBM sweeps all five gold medals at the South</text>
  <text x="28" y="233" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.65)">Zone University Badminton Championship 2026.</text>
  <!-- Meta -->
  <text x="28" y="285" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.40)">NSBM NewsDesk  •  Sports  •  nsbm.ac.lk</text>
  <!-- NSBM badge -->
  <rect x="28" y="400" width="130" height="28" rx="14" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1"/>
  <text x="93" y="419" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="0.5">NSBM GREEN UNIV.</text>
</svg>
