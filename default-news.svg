<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062018"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="gbarD" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a86b"/>
      <stop offset="100%" stop-color="#007a4e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bgD)"/>
  <!-- Decorative circles -->
  <circle cx="650" cy="200" r="180" fill="#00a86b" fill-opacity="0.04"/>
  <circle cx="650" cy="200" r="120" fill="#00a86b" fill-opacity="0.06"/>
  <circle cx="650" cy="200" r="60" fill="#00a86b" fill-opacity="0.08"/>
  <!-- NSBM logo mark center-right -->
  <g transform="translate(570, 100)">
    <!-- Newspaper / N icon -->
    <rect x="40" y="40" width="120" height="140" rx="8" fill="#0a2818" stroke="#00a86b" stroke-width="2"/>
    <rect x="52" y="55" width="96" height="12" rx="3" fill="#00a86b" opacity="0.6"/>
    <rect x="52" y="74" width="60" height="8" rx="2" fill="#00a86b" opacity="0.35"/>
    <rect x="52" y="88" width="80" height="8" rx="2" fill="#00a86b" opacity="0.35"/>
    <rect x="52" y="102" width="70" height="8" rx="2" fill="#00a86b" opacity="0.35"/>
    <rect x="52" y="116" width="96" height="8" rx="2" fill="#00a86b" opacity="0.25"/>
    <rect x="52" y="130" width="50" height="8" rx="2" fill="#00a86b" opacity="0.25"/>
    <!-- Folded corner -->
    <path d="M148 40 L160 52 L148 52 Z" fill="#00a86b" opacity="0.5"/>
    <!-- Pen icon -->
    <g transform="translate(110, 130) rotate(-30)" opacity="0.7">
      <rect x="0" y="0" width="8" height="30" rx="3" fill="#00a86b"/>
      <polygon points="0,30 8,30 4,42" fill="#00a86b"/>
      <rect x="1" y="2" width="6" height="4" rx="1" fill="#fff" opacity="0.3"/>
    </g>
  </g>
  <!-- Accent bar -->
  <rect x="0" y="0" width="5" height="450" fill="url(#gbarD)"/>
  <!-- Text -->
  <text x="40" y="165" font-family="Georgia,serif" font-size="34" font-weight="bold" fill="#ffffff" opacity="0.9">NSBM</text>
  <text x="40" y="210" font-family="Georgia,serif" font-size="34" font-weight="bold" fill="#00a86b">NewsDesk</text>
  <text x="40" y="265" font-family="Inter,sans-serif" font-size="15" fill="rgba(255,255,255,0.5)">Campus News &amp; Announcements</text>
  <text x="40" y="290" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.3)">NSBM Green University · Faculty of Computing</text>
  <!-- NSBM badge -->
  <rect x="40" y="380" width="130" height="28" rx="14" fill="rgba(0,168,107,0.15)" stroke="#00a86b" stroke-width="1"/>
  <text x="105" y="399" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#00a86b" text-anchor="middle" letter-spacing="0.5">NSBM GREEN UNIV.</text>
</svg>
