<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#0d2240"/>
      <stop offset="100%" stop-color="#001a0d"/>
    </linearGradient>
    <linearGradient id="gbar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00a86b"/>
      <stop offset="100%" stop-color="#00d48a"/>
    </linearGradient>
    <linearGradient id="overlay1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0a1628" stop-opacity="0.97"/>
      <stop offset="55%" stop-color="#0a1628" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Grid lines -->
  <g stroke="#00a86b" stroke-width="0.4" opacity="0.12">
    <line x1="0" y1="50" x2="800" y2="50"/><line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/><line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="100" y1="0" x2="100" y2="450"/><line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/><line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/><line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>
  <!-- Circuit board illustration (right side) -->
  <g transform="translate(480, 40)" opacity="0.9">
    <!-- Server rack -->
    <rect x="80" y="20" width="200" height="380" rx="8" fill="#0d2240" stroke="#00a86b" stroke-width="1.5"/>
    <!-- Server units -->
    <rect x="92" y="35" width="176" height="28" rx="4" fill="#091828" stroke="#1e4060" stroke-width="1"/>
    <rect x="92" y="70" width="176" height="28" rx="4" fill="#091828" stroke="#1e4060" stroke-width="1"/>
    <rect x="92" y="105" width="176" height="28" rx="4" fill="#091828" stroke="#00a86b" stroke-width="1.5"/>
    <rect x="92" y="140" width="176" height="28" rx="4" fill="#091828" stroke="#1e4060" stroke-width="1"/>
    <rect x="92" y="175" width="176" height="28" rx="4" fill="#091828" stroke="#1e4060" stroke-width="1"/>
    <rect x="92" y="210" width="176" height="28" rx="4" fill="#091828" stroke="#00a86b" stroke-width="1"/>
    <rect x="92" y="245" width="176" height="28" rx="4" fill="#091828" stroke="#1e4060" stroke-width="1"/>
    <rect x="92" y="280" width="176" height="28" rx="4" fill="#091828" stroke="#1e4060" stroke-width="1"/>
    <!-- Status lights -->
    <circle cx="108" cy="49" r="4" fill="#00a86b" filter="url(#glow1)"/>
    <circle cx="120" cy="49" r="4" fill="#00a86b" opacity="0.5"/>
    <circle cx="108" cy="84" r="4" fill="#fbbf24"/>
    <circle cx="120" cy="84" r="4" fill="#00a86b" filter="url(#glow1)"/>
    <circle cx="108" cy="119" r="4" fill="#00a86b" filter="url(#glow1)"/>
    <circle cx="120" cy="119" r="4" fill="#00a86b" filter="url(#glow1)"/>
    <circle cx="108" cy="154" r="4" fill="#00a86b" opacity="0.6"/>
    <circle cx="108" cy="189" r="4" fill="#fbbf24" opacity="0.7"/>
    <circle cx="108" cy="224" r="4" fill="#00a86b" filter="url(#glow1)"/>
    <circle cx="108" cy="259" r="4" fill="#00a86b" opacity="0.4"/>
    <circle cx="108" cy="294" r="4" fill="#ef4444" opacity="0.7"/>
    <!-- Data flow lines -->
    <line x1="50" y1="80" x2="80" y2="80" stroke="#00a86b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="50" y1="119" x2="80" y2="119" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="50" y1="159" x2="80" y2="159" stroke="#00a86b" stroke-width="1" opacity="0.4"/>
    <line x1="280" y1="84" x2="310" y2="84" stroke="#00a86b" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
    <line x1="280" y1="119" x2="310" y2="119" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.5"/>
    <!-- Chip top label -->
    <text x="180" y="15" font-family="monospace" font-size="10" fill="#00a86b" text-anchor="middle" opacity="0.8">AI RESEARCH LAB</text>
  </g>
  <!-- Left overlay gradient -->
  <rect width="800" height="450" fill="url(#overlay1)"/>
  <!-- Green accent bar -->
  <rect x="0" y="0" width="5" height="450" fill="url(#gbar1)"/>
  <!-- Category badge -->
  <rect x="28" y="30" width="90" height="24" rx="4" fill="#00a86b"/>
  <text x="73" y="47" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.5">ACADEMIC</text>
  <!-- Headline -->
  <text x="28" y="105" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">NSBM Inaugurates</text>
  <text x="28" y="140" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Next-Gen AI &amp; Cloud</text>
  <text x="28" y="175" font-family="Georgia,serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">Research Centre</text>
  <!-- Excerpt -->
  <text x="28" y="210" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.65)" letter-spacing="0.1">Faculty of Computing opens state-of-the-art</text>
  <text x="28" y="228" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.65)">GPU cluster laboratory for student research.</text>
  <!-- Meta row -->
  <text x="28" y="280" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.45)">NSBM NewsDesk  •  Faculty of Computing  •  nsbm.ac.lk</text>
  <!-- NSBM badge -->
  <rect x="28" y="400" width="130" height="28" rx="14" fill="rgba(0,168,107,0.15)" stroke="#00a86b" stroke-width="1"/>
  <text x="93" y="419" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#00a86b" text-anchor="middle" letter-spacing="0.5">NSBM GREEN UNIV.</text>
</svg>
