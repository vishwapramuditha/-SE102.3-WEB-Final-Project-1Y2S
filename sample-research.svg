<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051820"/>
      <stop offset="60%" stop-color="#0a2030"/>
      <stop offset="100%" stop-color="#001a15"/>
    </linearGradient>
    <linearGradient id="gbar4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="overlay4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#051820" stop-opacity="0.97"/>
      <stop offset="55%" stop-color="#051820" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#051820" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)"/>
  <!-- Data chart bars (right side) -->
  <g transform="translate(490, 60)">
    <!-- Chart frame -->
    <rect x="0" y="0" width="280" height="320" rx="8" fill="#051820" stroke="#06b6d4" stroke-width="1" opacity="0.8"/>
    <!-- Y-axis -->
    <line x1="40" y1="20" x2="40" y2="280" stroke="#1e4060" stroke-width="1"/>
    <!-- X-axis -->
    <line x1="40" y1="280" x2="260" y2="280" stroke="#1e4060" stroke-width="1"/>
    <!-- Bars -->
    <rect x="60" y="180" width="28" height="100" rx="3" fill="#06b6d4" opacity="0.8"/>
    <rect x="100" y="140" width="28" height="140" rx="3" fill="#10b981" opacity="0.8"/>
    <rect x="140" y="100" width="28" height="180" rx="3" fill="#06b6d4" opacity="0.9"/>
    <rect x="180" y="60" width="28" height="220" rx="3" fill="#00a86b" opacity="0.9"/>
    <rect x="220" y="80" width="28" height="200" rx="3" fill="#10b981" opacity="0.85"/>
    <!-- Bar glow tops -->
    <rect x="60" y="177" width="28" height="5" rx="2" fill="#38d4f4"/>
    <rect x="100" y="137" width="28" height="5" rx="2" fill="#34d399"/>
    <rect x="140" y="97" width="28" height="5" rx="2" fill="#38d4f4"/>
    <rect x="180" y="57" width="28" height="5" rx="2" fill="#00d48a"/>
    <rect x="220" y="77" width="28" height="5" rx="2" fill="#34d399"/>
    <!-- Trend line -->
    <polyline points="74,182 114,142 154,102 194,62 234,82" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4,2"/>
    <!-- Chart title -->
    <text x="140" y="305" font-family="Inter,sans-serif" font-size="10" fill="#06b6d4" text-anchor="middle">Research Output 2022–2026</text>
    <!-- Microscope icon hint -->
    <g transform="translate(5, 30)" opacity="0.7">
      <circle cx="20" cy="20" r="12" fill="none" stroke="#06b6d4" stroke-width="2"/>
      <line x1="20" y1="32" x2="20" y2="50" stroke="#06b6d4" stroke-width="2"/>
      <line x1="12" y1="50" x2="28" y2="50" stroke="#06b6d4" stroke-width="2"/>
      <line x1="20" y1="8" x2="20" y2="0" stroke="#06b6d4" stroke-width="2"/>
      <circle cx="20" cy="20" r="5" fill="#06b6d4" opacity="0.4"/>
    </g>
  </g>
  <!-- Left overlay -->
  <rect width="800" height="450" fill="url(#overlay4)"/>
  <!-- Accent bar -->
  <rect x="0" y="0" width="5" height="450" fill="url(#gbar4)"/>
  <!-- Category badge -->
  <rect x="28" y="30" width="90" height="24" rx="4" fill="#06b6d4"/>
  <text x="73" y="47" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#051820" text-anchor="middle" letter-spacing="0.5">ACADEMIC</text>
  <!-- Headline -->
  <text x="28" y="105" font-family="Georgia,serif" font-size="27" font-weight="bold" fill="#ffffff">NSBM Researchers</text>
  <text x="28" y="140" font-family="Georgia,serif" font-size="27" font-weight="bold" fill="#ffffff">Publish Breakthrough</text>
  <text x="28" y="175" font-family="Georgia,serif" font-size="27" font-weight="bold" fill="#06b6d4">in Machine Learning</text>
  <!-- Excerpt -->
  <text x="28" y="215" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.65)">Faculty team publishes in IEEE Transactions on</text>
  <text x="28" y="233" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.65)">Neural Networks — a first for the university.</text>
  <!-- Meta -->
  <text x="28" y="285" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.40)">NSBM NewsDesk  •  Academic  •  nsbm.ac.lk</text>
  <!-- NSBM badge -->
  <rect x="28" y="400" width="130" height="28" rx="14" fill="rgba(6,182,212,0.12)" stroke="#06b6d4" stroke-width="1"/>
  <text x="93" y="419" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#06b6d4" text-anchor="middle" letter-spacing="0.5">NSBM GREEN UNIV.</text>
</svg>
