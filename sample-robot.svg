<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05101e"/>
      <stop offset="60%" stop-color="#0a1a30"/>
      <stop offset="100%" stop-color="#001a10"/>
    </linearGradient>
    <linearGradient id="gbar6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#00a86b"/>
    </linearGradient>
    <linearGradient id="overlay6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#05101e" stop-opacity="0.97"/>
      <stop offset="55%" stop-color="#05101e" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#05101e" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="glow6"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg6)"/>
  <!-- Robot illustration -->
  <g transform="translate(480, 40)">
    <!-- Robot body -->
    <rect x="90" y="120" width="120" height="140" rx="12" fill="#0d1e36" stroke="#818cf8" stroke-width="2"/>
    <!-- Robot head -->
    <rect x="100" y="60" width="100" height="80" rx="12" fill="#0d1e36" stroke="#818cf8" stroke-width="2"/>
    <!-- Antenna -->
    <line x1="150" y1="60" x2="150" y2="30" stroke="#818cf8" stroke-width="2"/>
    <circle cx="150" cy="24" r="8" fill="#818cf8" filter="url(#glow6)"/>
    <!-- Eyes -->
    <rect x="115" y="78" width="24" height="18" rx="5" fill="#38bdf8" opacity="0.9"/>
    <rect x="161" y="78" width="24" height="18" rx="5" fill="#38bdf8" opacity="0.9"/>
    <circle cx="127" cy="87" r="5" fill="#fff" opacity="0.8"/>
    <circle cx="173" cy="87" r="5" fill="#fff" opacity="0.8"/>
    <!-- Mouth display -->
    <rect x="120" y="108" width="60" height="14" rx="4" fill="#050f1e"/>
    <g fill="#00a86b" opacity="0.9">
      <rect x="124" y="111" width="4" height="8" rx="1"/>
      <rect x="131" y="113" width="4" height="6" rx="1"/>
      <rect x="138" y="110" width="4" height="9" rx="1"/>
      <rect x="145" y="112" width="4" height="7" rx="1"/>
      <rect x="152" y="111" width="4" height="8" rx="1"/>
      <rect x="159" y="113" width="4" height="5" rx="1"/>
      <rect x="166" y="111" width="4" height="8" rx="1"/>
    </g>
    <!-- Body details -->
    <rect x="110" y="135" width="80" height="10" rx="3" fill="#818cf8" opacity="0.3"/>
    <circle cx="130" cy="170" r="12" fill="#050f1e" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="130" cy="170" r="6" fill="#818cf8" opacity="0.7"/>
    <rect x="115" y="195" width="70" height="8" rx="2" fill="#0a1a30" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <rect x="119" y="197" width="20" height="4" rx="1" fill="#00a86b" opacity="0.8"/>
    <rect x="143" y="197" width="10" height="4" rx="1" fill="#818cf8" opacity="0.6"/>
    <rect x="115" y="215" width="70" height="8" rx="2" fill="#0a1a30" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <rect x="119" y="217" width="40" height="4" rx="1" fill="#38bdf8" opacity="0.8"/>
    <!-- Arms -->
    <rect x="50" y="125" width="40" height="14" rx="6" fill="#0d1e36" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="48" cy="132" r="10" fill="#0d1e36" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="210" y="125" width="40" height="14" rx="6" fill="#0d1e36" stroke="#818cf8" stroke-width="1.5"/>
    <circle cx="252" cy="132" r="10" fill="#0d1e36" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Legs -->
    <rect x="110" y="260" width="35" height="60" rx="8" fill="#0d1e36" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="155" y="260" width="35" height="60" rx="8" fill="#0d1e36" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Feet -->
    <rect x="104" y="316" width="47" height="14" rx="6" fill="#0d1e36" stroke="#818cf8" stroke-width="1.5"/>
    <rect x="149" y="316" width="47" height="14" rx="6" fill="#0d1e36" stroke="#818cf8" stroke-width="1.5"/>
    <!-- Glow aura -->
    <ellipse cx="150" cy="200" rx="80" ry="110" fill="#818cf8" fill-opacity="0.03"/>
  </g>
  <!-- Left overlay -->
  <rect width="800" height="450" fill="url(#overlay6)"/>
  <!-- Accent bar -->
  <rect x="0" y="0" width="5" height="450" fill="url(#gbar6)"/>
  <!-- Category badge -->
  <rect x="28" y="30" width="74" height="24" rx="4" fill="#818cf8"/>
  <text x="65" y="47" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="0.5">EVENTS</text>
  <!-- Headline -->
  <text x="28" y="105" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#ffffff">Robotics Club Unveils</text>
  <text x="28" y="138" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#ffffff">Autonomous Campus</text>
  <text x="28" y="171" font-family="Georgia,serif" font-size="26" font-weight="bold" fill="#818cf8">Delivery Rover Prototype</text>
  <!-- Excerpt -->
  <text x="28" y="215" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.65)">NSBM Robotics Club presents their AI-powered</text>
  <text x="28" y="233" font-family="Inter,sans-serif" font-size="13" fill="rgba(255,255,255,0.65)">autonomous delivery robot at the campus expo.</text>
  <!-- Meta -->
  <text x="28" y="285" font-family="Inter,sans-serif" font-size="11" fill="rgba(255,255,255,0.40)">NSBM NewsDesk  •  Events  •  nsbm.ac.lk</text>
  <!-- NSBM badge -->
  <rect x="28" y="400" width="130" height="28" rx="14" fill="rgba(129,140,248,0.12)" stroke="#818cf8" stroke-width="1"/>
  <text x="93" y="419" font-family="Inter,sans-serif" font-size="11" font-weight="700" fill="#818cf8" text-anchor="middle" letter-spacing="0.5">NSBM GREEN UNIV.</text>
</svg>
